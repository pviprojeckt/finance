<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FinShift Mini App PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080E;--gl:rgba(255,255,255,.045);--bd:rgba(255,255,255,.08);--tx:#F4F7FB;--mu:#8B96A9;--em:#34D399;--vi:#8B5CF6;--bl:#38BDF8;--am:#FBBF24;--rd:#FB7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-variant-numeric:tabular-nums}
input,textarea{user-select:text}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(420px 320px at 90% -5%,rgba(139,92,246,.28),transparent 70%),radial-gradient(380px 300px at -10% 25%,rgba(52,211,153,.16),transparent 70%)}
.app-scroll{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 14px 120px}
.wrap{max-width:480px;margin:0 auto}
.glass{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--em),var(--vi));box-shadow:0 6px 20px rgba(139,92,246,.45)}
.pro{font-size:9px;padding:2px 6px;border-radius:6px;color:var(--em);border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);margin-left:6px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.cloud{font-size:10px;color:var(--mu);padding:6px 10px;border-radius:20px;background:var(--gl);border:1px solid var(--bd)}
.ib{width:34px;height:34px;border-radius:11px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:700 12px inherit;cursor:pointer}
button{font-family:inherit;color:inherit;cursor:pointer;transition:transform .12s}button:active{transform:scale(.95)}
.strip{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:11px;color:var(--mu);font-weight:600}
.big{font-size:20px;font-weight:800}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:13px;color:#04120C;background:linear-gradient(135deg,#6EE7B7,#34D399);box-shadow:0 6px 20px rgba(52,211,153,.35)}
.btn.sm{padding:9px 12px;font-size:12px;border-radius:12px}
.btn.gh{background:var(--gl);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.dg{background:rgba(251,113,133,.14);color:var(--rd);border:1px solid rgba(251,113,133,.35);box-shadow:none}
.btn.vi{background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;box-shadow:0 6px 20px rgba(139,92,246,.4)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(140deg,rgba(16,185,129,.35),rgba(99,102,241,.4) 60%,rgba(10,12,24,.8));box-shadow:0 18px 40px rgba(0,0,0,.5)}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-30px,25px) scale(1.15)}}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.14)}
.hv{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:8px 0 2px}
.hs{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:14px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:11px;border-radius:16px;background:rgba(6,8,14,.5);border:1px solid rgba(255,255,255,.08)}
.hg b{display:block;font-size:13px;margin-top:3px}
.hg span{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.sec{display:none;animation:in .3s ease}.sec.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.h2{font-size:14px;font-weight:800;margin:4px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:22px;background:rgba(14,18,30,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.nb{border:0;background:none;padding:8px 2px;border-radius:16px;font-size:10px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
.nb i{font-style:normal;font-size:17px}.nb.on{color:var(--tx);background:linear-gradient(135deg,rgba(52,211,153,.22),rgba(139,92,246,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.donut{display:flex;align-items:center;gap:16px}
.dw{position:relative;width:132px;height:132px;flex:none}
.dw svg{transform:rotate(-90deg)}
.dw circle{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dc b{font-size:15px}.dc span{font-size:9px;color:var(--mu);font-weight:700;text-transform:uppercase}
.lg{flex:1;display:grid;gap:8px;font-size:12px}
.lg div{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin-bottom:8px;font-size:12.5px;line-height:1.4;font-weight:600;border:1px solid var(--bd);background:var(--gl)}
.ins.g{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.ins.w{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.ins.r{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.08)}
.ins i{font-style:normal;font-size:17px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.it:last-child{border:0}
.il{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.tt{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}.ss{font-size:11px;color:var(--mu);margin-top:2px}
.ir{display:flex;align-items:center;gap:5px}.am{font-weight:800;font-size:13px;margin-right:2px}
.ma{width:30px;height:30px;border-radius:10px;border:1px solid var(--bd);background:var(--gl);font-size:12px}
.cb{width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none;font-size:13px;color:transparent;transition:all .2s}
.paid .cb{background:linear-gradient(135deg,#6EE7B7,#10B981);border-color:transparent;color:#04120C;box-shadow:0 0 14px rgba(52,211,153,.55)}
.paid .tt{opacity:.5;text-decoration:line-through}
.pb{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:10px 0}
.pf{height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#34D399,#38BDF8)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--gl);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
.tag{font-size:9px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(139,92,246,.2);color:#C4B5FD;border:1px solid rgba(139,92,246,.4);margin-left:6px;vertical-align:middle}
.tag.e{background:rgba(52,211,153,.14);color:var(--em);border-color:rgba(52,211,153,.4)}
.log{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;color:var(--mu)}
.log b{color:var(--tx)}
.empty{text-align:center;color:var(--mu);font-size:12.5px;padding:18px 6px;line-height:1.5}
.bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.bg.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;margin:0 auto;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:#0D111C;border:1px solid var(--bd);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.bg.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:17px}
.fl{display:block;font-size:11px;color:var(--mu);font-weight:700;margin-bottom:11px}
.fl input{display:block;width:100%;margin-top:6px;padding:13px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);font:700 15px inherit;outline:0}
.fl input:focus{border-color:rgba(52,211,153,.6)}
.sheet .btn{width:100%;margin-top:6px;padding:14px}
input[type=range]{width:100%;accent-color:var(--em);margin:8px 0 2px}
.sp3{display:flex;height:10px;border-radius:10px;overflow:hidden;margin:10px 0;gap:2px}
.sp3 div{transition:flex .3s}
.pr{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:6px 0}
textarea{width:100%;height:110px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--mu);font:11px monospace;padding:10px;margin-bottom:8px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(90px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;font-size:28px;font-weight:700;color:#04120C;background:linear-gradient(135deg,#6EE7B7,#34D399);box-shadow:0 10px 28px rgba(52,211,153,.5);z-index:25}
.chip.on{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.6);color:var(--em)}
</style>
</head>
<body>
<div class="app-scroll" id="scrollContainer"><div class="wrap">

<div class="top">
  <div class="brand"><div class="logo">💎</div><div>FinShift<span class="pro">PRO</span></div></div>
  <div class="row"><span class="cloud" id="syncStatus">🔄</span><button class="ib" onclick="openDev()">&lt;/&gt;</button></div>
</div>

<div class="glass strip" style="padding:12px 16px">
  <div onclick="openIncome()" style="cursor:pointer"><div class="lbl">Доход за месяц ✏️</div><div class="big" id="topSalaryVal">0</div></div>
  <button class="btn sm" onclick="openShift()">＋ Смена / Доход</button>
</div>

<div class="hero">
  <div class="row sp" style="position:relative;z-index:1"><span class="lbl" style="color:rgba(255,255,255,.8);letter-spacing:.5px">БЕЗОПАСНО НА ДЕНЬ</span><span class="pill" id="daysPill"></span></div>
  <div class="hv" id="safeDailyVal" style="position:relative;z-index:1">0 ₽</div>
  <div class="hs" id="freeSub" style="position:relative;z-index:1"></div>
  <div class="hg" style="position:relative;z-index:1">
    <div><span>К оплате</span><b id="hRes"></b></div>
    <div><span>Лимиты</span><b id="hLim"></b></div>
    <div><span>Копилка</span><b id="hSav"></b></div>
  </div>
</div>

<!-- ОБЗОР -->
<div class="sec on" id="tab-ov">
  <div id="insights"></div>
  <div class="glass" id="balCard"></div>
  <div class="glass" id="fcCard"></div>
  <div class="glass">
    <div class="h2">Куда уходят деньги</div>
    <div class="donut">
      <div class="dw">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="54" stroke="rgba(255,255,255,.06)" stroke-dasharray="340 0"/>
          <circle id="d0" cx="66" cy="66" r="54" stroke="#8B5CF6" stroke-dasharray="0 340"/>
          <circle id="d1" cx="66" cy="66" r="54" stroke="#38BDF8" stroke-dasharray="0 340"/>
          <circle id="d2" cx="66" cy="66" r="54" stroke="#FBBF24" stroke-dasharray="0 340"/>
          <circle id="d3" cx="66" cy="66" r="54" stroke="#34D399" stroke-dasharray="0 340"/>
        </svg>
        <div class="dc"><span>свободно</span><b id="dCenter"></b></div>
      </div>
      <div class="lg" id="legend"></div>
    </div>
  </div>
  <div class="glass"><div class="h2">Ближайшие платежи</div><div id="unpaidList"></div></div>
  <div class="glass"><div class="h2">История <button class="chip" onclick="clearHistory()">Очистить</button></div><div id="historyList"></div></div>
  <div class="glass" id="archCard"></div>
</div>

<!-- СЧЕТА -->
<div class="sec" id="tab-bills">
  <div class="glass"><div class="h2">Обязательные счета <button class="btn sm" onclick="openFixed()">＋ Добавить</button></div><div id="fixedList"></div></div>
</div>

<!-- ЛИМИТЫ -->
<div class="sec" id="tab-lim">
  <div class="h2">Переменные лимиты <button class="btn sm" onclick="openLimit()">＋ Категория</button></div>
  <div id="limList"></div>
</div>

<!-- ДОЛГИ -->
<div class="sec" id="tab-debt">
  <div class="glass" id="debtSummary"></div>
  <div class="h2">Убийца долгов <button class="btn sm vi" onclick="openDebt()">＋ Долг</button></div>
  <div id="debtList"></div>
</div>

<!-- КОПИЛКА -->
<div class="sec" id="tab-vault">
  <div class="glass" id="vaultCard"></div>
  <div class="glass">
    <div class="row sp"><span class="tt">🎯 Откладывать с дохода</span><b id="pctLbl"></b></div>
    <input type="range" min="0" max="60" step="1" id="pctRange" oninput="setPct(this.value)">
    <div class="ss">Правило «Сначала заплати себе»: эта доля автоматически уходит в копилку со смены.</div>
  </div>
</div>

</div></div>

<div class="nav" id="nav">
  <button class="nb on" onclick="tab('ov',this)"><i>✨</i>Обзор</button>
  <button class="nb" onclick="tab('bills',this)"><i>🧾</i>Счета</button>
  <button class="nb" onclick="tab('lim',this)"><i>🛒</i>Лимиты</button>
  <button class="nb" onclick="tab('debt',this)"><i>⛓️</i>Долги</button>
  <button class="nb" onclick="tab('vault',this)"><i>🏦</i>Копилка</button>
</div>

<button class="fab" onclick="openExpense()">＋</button>

<div class="bg" id="bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="grab"></div><h3 id="shTitle"></h3><div id="shBody" oninput="onLive()"></div><button class="btn" id="shSave"></button></div>
</div>

<script>
// 1. ЗАЩИТА ОТ СВОРАЧИВАНИЯ ПРИ СКРОЛЛЕ В TELEGRAM
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes(); try{tg.setHeaderColor('#06080E');tg.setBackgroundColor('#06080E')}catch(e){} }
const scroller = document.getElementById('scrollContainer');
let touchStartY = 0;
scroller.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
scroller.addEventListener('touchmove', e => {
  if (scroller.scrollTop <= 0 && e.touches[0].clientY > touchStartY) e.preventDefault();
}, { passive: false });

const USER_ID = tg?.initDataUnsafe?.user?.id || 'dev_user_test';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU') + ' ₽';
function hp(t) { try { const h = tg?.HapticFeedback; if (!h) return;
  if (t === 'ok') h.notificationOccurred('success'); else if (t === 'warn') h.notificationOccurred('warning');
  else h.impactOccurred(t || 'light'); } catch (e) {} }
function ask(msg, cb) { if (tg?.showConfirm) { try { tg.showConfirm(msg, ok => ok && cb()); return; } catch (e) {} } if (confirm(msg)) cb(); }

// 2. СТЕЙТ + ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ SUPABASE + РЕЗЕРВ В LOCALSTORAGE
const DEFAULT_STATE = {
  income: 85000, savingsGoalPct: 20, actualSaved: 17000,
  savingsGoalTarget: 100000, savingsGoalName: 'Подушка безопасности',
  reservePct: 30, reserveBalance: 0, extraDebt: 0,
  balance: 0, balanceSet: false, balanceChecked: '', earned: 0, month: '', lastCat: '', shiftLog: [], archive: [],
  fixed: [
    { id: 'f1', title: 'Аренда квартиры', amount: 25000, day: 5, paid: false },
    { id: 'f2', title: 'ЖКХ, интернет, связь', amount: 3500, day: 10, paid: true },
    { id: 'f3', title: 'VPS Сервер / Подписки', amount: 1500, day: 15, paid: false }
  ],
  limits: [
    { id: 'l1', title: 'Продукты и быт', limit: 18000, spent: 6400 },
    { id: 'l2', title: 'Спортпит и здоровье', limit: 4500, spent: 1500 },
    { id: 'l3', title: 'Проезд / Такси со смен', limit: 4000, spent: 1200 }
  ],
  debts: [],
  history: [{ title: 'Начальный баланс настроен', amount: 85000, type: 'plus', date: 'Сегодня' }]
};
let state = clone(DEFAULT_STATE);

// Безопасный мерж: старый стейт из БД не ломает приложение, недостающие поля берутся из дефолта
function mergeState(s) {
  const o = clone(DEFAULT_STATE);
  if (!s || typeof s !== 'object') return o;
  for (const k in DEFAULT_STATE) {
    const d = DEFAULT_STATE[k], v = s[k];
    if (v === undefined || v === null) continue;
    if (Array.isArray(d)) { if (Array.isArray(v)) o[k] = v; }
    else if (typeof d === 'number') { const n = Number(v); if (!isNaN(n)) o[k] = n; }
    else o[k] = v;
  }
  return o;
}

let syncTimer;
function saveState() {
  try { localStorage.setItem('finshift_backup_state', JSON.stringify(state)); } catch (e) {}
  const badge = $('syncStatus');
  badge.textContent = '⏳ Сохранение...';
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: USER_ID, state }) });
      if (!res.ok) throw new Error('Cloud error');
      badge.textContent = '☁️ Облако: ОК';
    } catch (err) { badge.textContent = '💾 Сохранено'; }
  }, 350);
}

async function loadState() {
  const badge = $('syncStatus');
  badge.textContent = '🔄 Загрузка...';
  try { const local = localStorage.getItem('finshift_backup_state'); if (local) state = mergeState(JSON.parse(local)); } catch (e) {}
  render();
  try {
    const res = await fetch(`/api/sync?userId=${USER_ID}`);
    const data = await res.json();
    if (data && data.state) state = mergeState(data.state);
    badge.textContent = '☁️ Облако: ОК';
  } catch (e) { badge.textContent = '💾 Автономно'; }
  rollover();
  const botIncome = Number(new URLSearchParams(window.location.search).get('income'));
  if (botIncome > 0 && state.income !== botIncome) {
    state.income = botIncome; addLog('Синхронизация ЗП из бота', botIncome, 'plus'); saveState();
  }
  render();
}

function addLog(title, amount, type = 'minus') {
  const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  state.history = state.history || [];
  state.history.unshift({ title, amount, type, date: t });
  if (state.history.length > 20) state.history.pop();
}
const commit = () => { saveState(); render(); };

// 3. РАСЧЁТЫ
const rem = d => Math.max(0, Number(d.total) - Number(d.paid));
function dleft() { const d = new Date(); return Math.max(1, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() + 1); }
function calc() {
  const dl = dleft();
  const fixedTotal = state.fixed.reduce((a, i) => a + Number(i.amount), 0);
  const act = state.debts.filter(d => rem(d) > 0 || d.minPaid);
  const debtMin = act.reduce((a, d) => a + Number(d.min), 0);
  const unpaidFixed = state.fixed.filter(i => !i.paid).reduce((a, i) => a + Number(i.amount), 0);

  curCat = state.limits.some(l => l.id === state.lastCat) ? state.lastCat : state.limits[0].id;
  openSheet({ title: '⚡ Быстрая трата', label: 'Записать трату', fields: [{ k: 'v', l: 'Сумма, ₽', p: '450' }, { k: 'n', l: 'Заметка (необязательно)', t: 'text', p: 'Кофе' }, { k: 'sms', l: 'Или вставь SMS из банка', t: 'text', p: 'Покупка 450р MAGNIT…' }],
    html: `<div class="lbl" style="margin-bottom:6px">КАТЕГОРИЯ</div><div class="chips" id="catChips" style="margin-bottom:12px">${state.limits.map(l => `<button class="chip ${l.id === curCat ? 'on' : ''}" data-id="${l.id}" onclick="pickCat('${l.id}')">${esc(l.title)}</button>`).join('')}</div>`,
    live() { const t = gv('sms'); if (t && gv('v') === '') { const a = parseSms(t); if (a > 0) $('f_v').value = a; } },
    save() { const v = gn('v'), i = state.limits.find(x => x.id === curCat); if (v <= 0 || !i) return false;
      i.spent = Number(i.spent) + v; state.balance -= v; state.lastCat = i.id; addLog((gv('n').trim() || i.title) + ' · ' + i.title, v, 'minus');
      hp(i.spent > i.limit ? 'warn' : 'ok'); commit(); closeSheet(); } });
  setTimeout(() => { const e = $('f_v'); if (e) e.focus(); }, 350);
}

// Доход
function openIncome() { openSheet({ title: '💰 Месячный доход', fields: [{ k: 'v', l: 'Плановый доход за месяц, ₽ (вырастет сам, если заработаешь больше)', v: state.income }],
  save() { const v = gn('v'); if (v < 0) return false; state.income = v; addLog('Обновлён месячный доход', v, 'plus'); commit(); closeSheet(); } }); }

// Smart Shift Splitter
function openShift() {
  openSheet({ title: '⚡ Приход со смены', label: 'Распределить и сохранить', fields: [
    { k: 'sum', l: 'Сумма за смену, ₽', p: '5000' }, { k: 'note', l: 'Заметка', t: 'text', v: '', p: 'Смена' },
    { k: 'rp', l: '% в резерв (счета и долги)', v: state.reservePct }, { k: 'sp', l: '% в копилку (сначала заплати себе)', v: state.savingsGoalPct }],
    html: `<div class="sp3"><div id="s1" style="background:#8B5CF6"></div><div id="s2" style="background:#FBBF24"></div><div id="s3" style="background:#34D399"></div></div>
    <div class="pr"><span>🛡️ Резерв на счета и долги</span><b id="p1"></b></div><div class="pr"><span>🏦 Неприкосновенная копилка</span><b id="p2"></b></div><div class="pr"><span>🎯 В безопасный бюджет</span><b id="p3" style="color:var(--em)"></b></div>`,
    live() { const s = gn('sum'), a = Math.max(0, Math.min(100, gn('rp'))), b = Math.max(0, Math.min(100 - a, gn('sp')));
      const r = Math.round(s * a / 100), v = Math.round(s * b / 100), f = s - r - v;
      $('p1').textContent = fmt(r); $('p2').textContent = fmt(v); $('p3').textContent = fmt(f);
      $('s1').style.flex = a || 0.001; $('s2').style.flex = b || 0.001; $('s3').style.flex = Math.max(0.001, 100 - a - b); },
    save() { const s = gn('sum'), a = gn('rp'), b = gn('sp'); if (s <= 0 || a < 0 || b < 0 || a + b > 100) return false;
      const r = Math.round(s * a / 100), v = Math.round(s * b / 100);
      state.earned = (Number(state.earned) || 0) + s; state.income = Math.max(state.income, state.earned); state.balance += s - v; state.shiftLog.unshift(s); state.shiftLog = state.shiftLog.slice(0, 40); state.actualSaved = (Number(state.actualSaved) || 0) + v; state.reserveBalance = (Number(state.reserveBalance) || 0) + r;
      state.reservePct = a; state.savingsGoalPct = b;
      addLog((gv('note').trim() || 'Приход со смены') + ` (в резерв ${fmt(r)}, в копилку ${fmt(v)})`, s, 'plus'); commit(); closeSheet(); } });
}

// Счета
function toggleFixed(id) { const i = state.fixed.find(x => x.id === id); if (!i) return; i.paid = !i.paid; state.balance += i.paid ? -i.amount : i.amount;
  state.reserveBalance = Math.max(0, (Number(state.reserveBalance) || 0) + (i.paid ? -i.amount : i.amount));
  if (i.paid) addLog('Оплачено: ' + i.title, i.amount, 'minus'); hp(i.paid ? 'ok' : 'light'); commit(); }
function openFixed(id) { const i = id ? state.fixed.find(x => x.id === id) : null;
  openSheet({ title: i ? '✏️ Редактировать платёж' : '➕ Новый обязательный счёт', fields: [
    { k: 't', l: 'Название', t: 'text', v: i?.title, p: 'Аренда' }, { k: 'a', l: 'Сумма, ₽', v: i?.amount }, { k: 'd', l: 'День месяца', v: i?.day || 10 }],
    save() { const t = gv('t').trim(), a = gn('a'); if (!t || a < 0) return false;
      if (i) { i.title = t; i.amount = a; i.day = gn('d') || 10; } else state.fixed.push({ id: 'f_' + Date.now(), title: t, amount: a, day: gn('d') || 10, paid: false });
      commit(); closeSheet(); } }); }

// Лимиты
function openLimit(id) { const i = id ? state.limits.find(x => x.id === id) : null;
  openSheet({ title: i ? '✏️ Редактировать категорию' : '➕ Новая категория', fields: [
    { k: 't', l: 'Название', t: 'text', v: i?.title, p: 'Кафе' }, { k: 'm', l: 'Лимит на месяц, ₽', v: i?.limit }, { k: 's', l: 'Уже потрачено, ₽', v: i?.spent || 0 }],
    save() { const t = gv('t').trim(), m = gn('m'); if (!t || m < 0) return false;
      if (i) { i.title = t; i.limit = m; i.spent = Math.max(0, gn('s')); } else state.limits.push({ id: 'l_' + Date.now(), title: t, limit: m, spent: Math.max(0, gn('s')) });
      commit(); closeSheet(); } }); }
function quickSpend(id, d) { const i = state.limits.find(x => x.id === id); if (!i) return;
  const b4 = Number(i.spent); i.spent = Math.max(0, b4 + d); state.balance -= i.spent - b4; state.lastCat = id; if (d > 0) addLog(i.title, d, 'minus'); hp(i.spent > i.limit ? 'warn' : 'light'); commit(); }
function openSpend(id) { const i = state.limits.find(x => x.id === id); if (!i) return;
  openSheet({ title: 'Трата: ' + i.title, fields: [{ k: 'v', l: 'Сумма (минус — вернуть), ₽', p: '750' }], save() { const v = gn('v'); if (!v) return false; quickSpend(id, v); closeSheet(); } }); }

// Долги
function toggleDebtMin(id) { const d = state.debts.find(x => x.id === id); if (!d) return;
  d.minPaid = !d.minPaid; const m = Math.min(Number(d.min), rem(d) + (d.minPaid ? 0 : Number(d.min)));
  if (d.minPaid) { const pay = Math.min(Number(d.min), rem(d)); d.paid = Number(d.paid) + pay; d.lastMin = pay; state.balance -= pay; addLog('Мин. платёж: ' + d.title, pay, 'minus'); hp('ok'); }
  else { const u = d.lastMin || Number(d.min); d.paid = Math.max(0, Number(d.paid) - u); state.balance += u; hp('light'); }
  commit(); }
function openDebt(id) { const d = id ? state.debts.find(x => x.id === id) : null;
  openSheet({ title: d ? '✏️ Редактировать долг' : '⛓️ Новый долг', fields: [
    { k: 't', l: 'Название (кредитка, рассрочка…)', t: 'text', v: d?.title }, { k: 'tot', l: 'Общий долг, ₽', v: d?.total }, { k: 'pd', l: 'Уже выплачено, ₽', v: d?.paid || 0 },
    { k: 'mn', l: 'Минимальный платёж в месяц, ₽', v: d?.min }, { k: 'rt', l: 'Ставка, % годовых (приоритет)', v: d?.rate || 0 }],
    save() { const t = gv('t').trim(), tot = gn('tot'), mn = gn('mn'); if (!t || tot <= 0 || mn < 0) return false;
      const o = { title: t, total: tot, paid: Math.max(0, gn('pd')), min: mn, rate: gn('rt') };
      if (d) Object.assign(d, o); else state.debts.push({ id: 'd_' + Date.now(), minPaid: false, ...o });
      commit(); closeSheet(); } }); }
function openExtra(id) { const d = state.debts.find(x => x.id === id); if (!d) return; const c = calc(), r = rem(d);
  openSheet({ title: '⚡ Досрочный платёж', label: 'Внести платёж', cls: 'vi', fields: [{ k: 'v', l: `Сумма, ₽ (остаток долга ${fmt(r)})`, p: String(Math.min(r, Math.max(0, c.free))) }],
    html: `<div class="ss" style="margin:-4px 0 10px">Свободный остаток месяца: <b style="color:var(--em)">${fmt(Math.max(0, c.free))}</b></div><div class="ins g" id="exInfo"></div>`,
    live() { const x = Math.min(r, gn('v')), now = eta(r, d.min), nw = eta(r - x, d.min);
      $('exInfo').innerHTML = x > 0 ? `<i>🚀</i><div>Долг «${esc(d.title)}»: ${mon(now)} → <b>${mon(nw)}</b>${now !== Infinity && now > nw ? ', быстрее на ' + (now - nw) + ' мес.' : ''}. Останется ${fmt(r - x)}.</div>` : '<i>💡</i><div>Введи сумму — покажу, насколько быстрее закроешь долг.</div>'; },
    save() { const x = gn('v'); if (x <= 0 || x > r) return false;
      d.paid = Number(d.paid) + x; state.balance -= x; state.extraDebt = (Number(state.extraDebt) || 0) + x; addLog('Досрочно: ' + d.title, x, 'minus');
      hp('ok'); commit(); closeSheet(); } }); }

// Копилка
function openGoal() { openSheet({ title: '🏦 Цель копилки', fields: [{ k: 'n', l: 'Название цели', t: 'text', v: state.savingsGoalName }, { k: 'tg', l: 'Сумма цели, ₽', v: state.savingsGoalTarget }, { k: 'sv', l: 'Накоплено сейчас, ₽', v: state.actualSaved }],
  save() { const n = gv('n').trim(), t = gn('tg'), s = gn('sv'); if (!n || t <= 0 || s < 0) return false;
    state.savingsGoalName = n; state.savingsGoalTarget = t; state.actualSaved = s; commit(); closeSheet(); } }); }
function openDeposit() { openSheet({ title: '＋ Пополнить копилку', fields: [{ k: 'v', l: 'Сумма, ₽', p: '2000' }],
  save() { const v = gn('v'); if (v <= 0) return false; state.actualSaved = (Number(state.actualSaved) || 0) + v; state.balance -= v; addLog('В копилку: ' + state.savingsGoalName, v, 'plus'); commit(); closeSheet(); } }); }
function openWithdraw() { openSheet({ title: '🔒 Забрать из копилки', cls: 'dg', label: 'Продолжить', fields: [{ k: 'v', l: `Сумма, ₽ (в сейфе ${fmt(state.actualSaved)})` }],
  html: '<div class="ins w"><i>🧠</i><div>Подожди 10 секунд: это правда необходимо, или импульс? Деньги в сейфе — твоя свобода.</div></div>',
  save() { const v = gn('v'); if (v <= 0 || v > state.actualSaved) return false; hp('warn');
    ask(`Забрать ${fmt(v)} из копилки?`, () => { state.actualSaved -= v; state.balance += v; addLog('Из копилки: ' + state.savingsGoalName, v, 'minus'); commit(); closeSheet(); }); return false; } }); }

// Удаление с подтверждением (для всех списков)
function delItem(arr, id) { const i = state[arr].find(x => x.id === id); if (!i) return; hp('warn');
  ask(`Удалить «${i.title}»?`, () => { state[arr] = state[arr].filter(x => x.id !== id); commit(); hp('ok'); }); }
function clearHistory() { state.history = []; commit(); }

// Меню разработчика
function openDev() {
  openSheet({ title: '</> Данные и синхронизация', label: 'Копировать JSON', cls: 'gh',
    html: `<div class="ss" style="margin-bottom:8px">User ID: <b style="color:#fff">${esc(USER_ID)}</b></div><textarea id="devJson" readonly>${esc(JSON.stringify(state, null, 2))}</textarea>
    <button class="btn gh" onclick="sendBot()">Отправить в бота (sendData)</button><button class="btn dg" onclick="resetAll()">Сбросить к стандартным</button>`,
    save() { const a = $('devJson'); a.select(); try { navigator.clipboard.writeText(a.value); } catch (e) { document.execCommand('copy'); } hp('ok'); return false; } });
}
function sendBot() { if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(state)); else alert('sendData доступна при открытии через кнопку Telegram-бота.'); }
function resetAll() { ask('Сбросить все цифры к стандартным?', () => { state = clone(DEFAULT_STATE); commit(); closeSheet(); }); }

loadState();
</script>
</body>
</html>
